[package]
name = "cadrust-py"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Python bindings to cad-rust-app's OpenCascade kernel"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
cxx = "1.0.205"
rayon = "1.12"
glam = "0.34.1"
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
opencascade-sys = { version = "0.3", features = ["builtin"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
