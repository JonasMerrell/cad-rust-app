name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # OpenCascade itself (the slow part): its installed headers and static libraries
      - uses: actions/cache@v4
        with:
          path: target/OCCT
          key: occt-7.8.1-${{ matrix.name }}-v1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/cad-app
          cp target/release/cad-rust-app dist/cad-app/cad-app
          strip dist/cad-app/cad-app
          cp AGENTS.md dist/cad-app/
          cp -r examples dist/cad-app/
          tar -C dist -cJf cad-app-${{ matrix.name }}.tar.xz cad-app
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/cad-app | Out-Null
          Copy-Item target/release/cad-rust-app.exe dist/cad-app/cad-app.exe
          Copy-Item AGENTS.md dist/cad-app/
          Copy-Item -Recurse examples dist/cad-app/
          Compress-Archive -Path dist/cad-app -DestinationPath cad-app-${{ matrix.name }}.zip
      - name: Trim the OpenCascade cache
        shell: bash
        run: rm -rf target/OCCT/build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cad-app-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
