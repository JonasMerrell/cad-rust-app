[package]
name = "cad-rust-app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cxx = "1.0.205"
earcutr = "0.5.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg", "image"] }
env_logger = "0.11.11"
epaint_default_fonts = "0.36"
glam = { version = "0.34.1", features = ["bytemuck", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
opencascade = "0.3"
opencascade-sys = "0.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ttf-parser = "0.25.1"

[profile.release]
incremental = true
debug = false

[patch.crates-io]
opencascade = { path = "crates/opencascade" }
opencascade-sys = { path = "crates/opencascade-sys" }
